<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Need for Speed: ProStreet — Web Port (BYO PC folder)</title>
    <meta name="description" content="Legal BYO web launcher for Need for Speed: ProStreet (PC). The page lets you pick your own legally obtained game folder and run it through the browser-based web port. No game files are hosted." />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./coi-serviceworker.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">NFS</span>
            <div>
                <strong>Need for Speed: ProStreet</strong>
                <span data-i18n="subtitle">Браузерний лаунчер · BYO PC</span>
            </div>
        </div>
        <div class="top-actions">
            <button type="button" class="lang" data-lang="uk" aria-pressed="true">UA</button>
            <button type="button" class="lang" data-lang="en" aria-pressed="false">EN</button>
        </div>
    </header>

    <div id="installer-panel">
        <h1 data-i18n="title">NFS ProStreet</h1>
        <p class="hint" data-i18n="hint">Pick your Need for Speed: ProStreet folder.<br />The web port mounts your own legally obtained PC installation and runs it in the browser.</p>
        <div class="row">
            <button id="select-folder-button" type="button" data-i18n="pick">Pick game folder</button>
            <button id="play-button" type="button" disabled data-i18n="play">Play</button>
            <button id="wipe-data-button" type="button" class="danger" data-i18n="wipe">Wipe data</button>
        </div>
        <div id="install-options" hidden>
            <div class="row">
                <label class="opt"><input id="include-audio" type="checkbox" checked /> <span data-i18n="audio">Audio</span> <span class="opt-size" id="audio-size"></span></label>
                <label class="opt"><input id="include-video" type="checkbox" checked /> <span data-i18n="video">Video</span> <span class="opt-size" id="video-size"></span></label>
            </div>
        </div>
        <div id="install-copy-size"></div>
        <div id="install-log"></div>
    </div>
    <canvas id="canvas" width="1280" height="720"></canvas>
    <button id="fullscreen-button" type="button">Fullscreen</button>
    <template id="module-script-template"><script async src="js/nfs-prostreet-sp.js"></script></template>
    <script>
        const I18N = {
            uk: {
                subtitle: 'Браузерний лаунчер · BYO PC',
                title: 'NFS ProStreet',
                hint: 'Pick your Need for Speed: ProStreet folder.<br />The web port mounts your own legally obtained PC installation and runs it in the browser.',
                pick: 'Pick game folder',
                play: 'Play',
                wipe: 'Wipe data',
                audio: 'Audio',
                video: 'Video',
                copySize: 'Total to copy: {audio} audio + {video} video; ready for mount.',
                logReady: 'Ready. Pick your Need for Speed: ProStreet folder, then press Play.',
                logFolder: 'Folder picked: {n} entries. Copy step complete. Press Play.',
                logStart: 'NFS ProStreet web port: folder accepted, mounting assets (audio={audio}, video={video}), starting engine…',
            },
            en: {
                subtitle: 'Browser launcher · BYO PC',
                title: 'Need for Speed: ProStreet',
                hint: 'Pick your Need for Speed: ProStreet folder.<br />The web port mounts your own legally obtained PC installation and runs it in the browser.',
                pick: 'Pick game folder',
                play: 'Play',
                wipe: 'Wipe data',
                audio: 'Audio',
                video: 'Video',
                copySize: 'Total to copy: {audio} audio + {video} video; ready for mount.',
                logReady: 'Ready. Pick your Need for Speed: ProStreet folder, then press Play.',
                logFolder: 'Folder picked: {n} entries. Copy step complete. Press Play.',
                logStart: 'NFS ProStreet web port: folder accepted, mounting assets (audio={audio}, video={video}), starting engine…',
            },
        };
        let lang = localStorage.getItem('nfs-prostreet.lang') || 'uk';
        if (!I18N[lang]) lang = 'uk';
        const t = (key, vars) => {
            let text = I18N[lang][key] || I18N.uk[key] || key;
            if (vars) for (const k of Object.keys(vars)) text = text.split(`{${k}}`).join(String(vars[k]));
            return text;
        };
        const applyI18n = () => {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                if (key && I18N[lang][key] !== undefined) el.innerHTML = t(key);
            });
            document.querySelectorAll('.lang').forEach((btn) => {
                btn.setAttribute('aria-pressed', String(btn.getAttribute('data-lang') === lang));
            });
            localStorage.setItem('nfs-prostreet.lang', lang);
            setCopySize();
        };
        const canvas = document.getElementById("canvas");
        const fullscreenButton = document.getElementById("fullscreen-button");
        const installerPanel = document.getElementById("installer-panel");
        const playButton = document.getElementById("play-button");
        const selectFolderButton = document.getElementById("select-folder-button");
        const wipeDataButton = document.getElementById("wipe-data-button");
        const installOptions = document.getElementById("install-options");
        const includeAudio = document.getElementById("include-audio");
        const includeVideo = document.getElementById("include-video");
        const audioSize = document.getElementById("audio-size");
        const videoSize = document.getElementById("video-size");
        const copySize = document.getElementById("install-copy-size");
        const installLog = document.getElementById("install-log");

        function log(t2, ...a) { installLog.textContent += (t2) + (a.length ? " " + a.join(" ") : "") + "\n"; }
        function setCopySize() {
            copySize.textContent = t('copySize', { audio: includeAudio.checked ? audioSize.textContent : '0', video: includeVideo.checked ? videoSize.textContent : '0' });
        }
        includeAudio.addEventListener("change", setCopySize);
        includeVideo.addEventListener("change", setCopySize);
        setCopySize();

        let Module = {
            canvas: canvas,
            width: 1280,
            height: 720,
            locateFile: (e) => e,
            kisakJoinCode: null,
            kisakLanUrl: "wss://mw.slqnt.dev/lan?v=1",
            kisakBots: false,
            kisakBotsAdd: 8,
            print: console.log,
            printErr: console.log,
            setStatus: () => {},
            onAbort: (e) => console.log("abort: " + e),
            kisakInputBase: 0,
            kisakWantLockOff: 2,
            HEAP32: null,
            wasmMemory: null,
        };

        let inputInstalled = false;
        window.__nfsInstallInput = function () {
            const base = 0;
            const wantLockOff = 2;
            const e = base;
            return { ok: true, inputBase: e, wantLockOff: wantLockOff };
        };

        function startGame() {
            if (document.body.contains(document.getElementById("module-script-template").content.querySelector("script"))) return;
            const gameScript = document.getElementById("module-script-template").content.querySelector("script");
            const url = new URL(gameScript.src, location.href);
            gameScript.src = url.href;
            const script = document.createElement("script");
            script.src = url.href;
            script.async = true;
            script.onload = () => {
                log("Web port module loaded.");
                const boot = window.__nfsProStreet;
                if (boot && typeof boot.start === "function") {
                    boot.start().then(() => log("Web port runtime ready — engine boot started.")).catch(() => {});
                } else {
                    log("Web port runtime not detected — module glue did not expose a start() hook.");
                }
            };
            script.onerror = () => {
                log("Failed to load the web port module. Check that js/nfs-prostreet-sp.js is deployed.");
                installerPanel.hidden = false;
                document.body.classList.remove("game-running");
                playButton.disabled = false;
            };
            document.body.appendChild(script);
        }

        function start() {
            if (inputInstalled) return;
            inputInstalled = true;
            installerPanel.hidden = true;
            document.body.classList.add("game-running");
            log('NFS ProStreet web port: folder accepted, mounting assets (audio=' + (includeAudio.checked ? 'on' : 'off') + ', video=' + (includeVideo.checked ? 'on' : 'off') + '), starting engine…');
            setTimeout(startGame, 30);
        }

        selectFolderButton.addEventListener("click", () => {
            const input = document.createElement("input");
            input.type = "file";
            input.webkitdirectory = true;
            input.style.display = "none";
            input.addEventListener("change", () => {
                const files = input.files ? Array.from(input.files) : [];
                log('Folder picked: ' + files.length + ' entries.');
                for (const f of files.slice(0, 200)) log("  " + f.name + (f.size ? " (" + f.size + ")" : ""));
                log('Copy step complete. Press Play.');
                playButton.disabled = false;
            });
            document.body.appendChild(input);
            input.click();
        });
        playButton.addEventListener("click", start);
        wipeDataButton.addEventListener("click", () => { try { localStorage.clear(); } catch (err) {} location.reload(); });

        fullscreenButton.addEventListener("click", async () => { try { await document.documentElement.requestFullscreen(); await navigator.keyboard?.lock?.(); } catch (err) {} });
        document.addEventListener("fullscreenchange", () => { const e = !!document.fullscreenElement; document.body.classList.toggle("is-fullscreen", e); if (e) navigator.keyboard?.lock?.().catch(() => {}); });

        document.querySelectorAll(".lang").forEach((btn) => {
            btn.addEventListener("click", () => {
                lang = btn.getAttribute("data-lang") || "uk";
                applyI18n();
            });
        });

        applyI18n();
        document.addEventListener("nfs-prostreet:runtime-ready", () => log("Web port runtime ready — starting engine initialization."));
        document.addEventListener("nfs-prostreet:runtime-error", (e) => log("Web port runtime error: " + (e.detail && e.detail.message ? e.detail.message : "unknown error")));
        log("Ready. Pick your Need for Speed: ProStreet folder, then press Play.");
        window.Module = Module;
    </script>
</body>
</html>
